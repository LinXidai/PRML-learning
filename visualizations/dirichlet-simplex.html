<style>
  #dirichlet-simplex { display: grid; gap: calc(var(--font-size-base, 1rem) * .5); }
  #dirichlet-simplex .simplex-plot { width: 100%; max-width: 352px; margin-inline: auto; }
  #dirichlet-simplex .simplex-top-label { text-align: center; }
  #dirichlet-simplex .simplex-base-labels { display: flex; justify-content: space-between; }
  #dirichlet-simplex .simplex-base-labels span { width: 80px; text-align: center; }
  #dirichlet-simplex .simplex-plot svg { display: block; width: calc(100% - 80px); height: auto; margin-inline: auto; }
  #dirichlet-simplex .simplex-frame { stroke: var(--muted-foreground, currentColor); }
  #dirichlet-simplex .simplex-samples {
    stroke: var(--viz-series-1, var(--blue, currentColor));
    opacity: .7;
  }
</style>
<script>
(() => {
  const root = document.getElementById('dirichlet-simplex');
  const select = root.querySelector('select');
  const points = root.querySelector('.simplex-samples');
  const summary = root.querySelector('p');
  const allowedValues = Array.from(select.options, option => option.value);
  const sampleCache = new Map();

  function uniform() {
    return 1 - Math.random();
  }

  function gamma(shape) {
    if (shape < 1) {
      return gamma(shape + 1) * Math.pow(uniform(), 1 / shape);
    }
    const d = shape - 1 / 3;
    const c = 1 / Math.sqrt(9 * d);
    // Marsaglia–Tsang sampling with unit rate.
    for (;;) {
      const normal = Math.sqrt(-2 * Math.log(uniform())) * Math.cos(2 * Math.PI * uniform());
      const base = 1 + c * normal;
      if (base <= 0) continue;
      const v = base ** 3;
      if (Math.log(uniform()) < normal ** 2 / 2 + d * (1 - v + Math.log(v))) {
        return d * v;
      }
    }
  }

  function getSamples(alpha) {
    const key = alpha.join(',');
    if (!sampleCache.has(key)) {
      const samples = Array.from({ length: 1200 }, () => {
        const draws = alpha.map(gamma);
        const total = draws.reduce((sum, value) => sum + value, 0);
        return draws.map(value => value / total);
      });
      sampleCache.set(key, samples);
    }
    return sampleCache.get(key);
  }

  function draw() {
    const alpha = select.value.split(',').map(Number);
    const total = alpha.reduce((sum, value) => sum + value, 0);
    // Transform the probability vector using the SVG triangle's vertices.
    const marks = getSamples(alpha).map(([a, , c]) => {
      const x = 134 * a + 268 * c;
      const y = 232 * (1 - a);
      return `M ${x.toFixed(2)} ${y.toFixed(2)} h .01`;
    });
    points.setAttribute('d', marks.join(' '));
    const mean = alpha.map(value => (100 * value / total).toFixed(1) + '%');
    const description = `均值（A, B, C）为（${mean.join('，')}） · α₀ = ${Number(total.toPrecision(10))}`;
    if (summary.textContent !== description) summary.textContent = description;
  }

  function restore(state) {
    const value = state?.privateContent?.alpha;
    if (allowedValues.includes(value)) select.value = value;
    draw();
  }

  select.addEventListener('change', () => {
    draw();
    window.openai?.setWidgetState?.({
      modelContent: { alpha: select.value.split(',').map(Number) },
      privateContent: { alpha: select.value }
    }).catch(() => {});
  });
  window.addEventListener('openai:set_globals', event => restore(event.detail?.globals?.widgetState));
  restore(window.openai?.widgetState);
})();
</script>
