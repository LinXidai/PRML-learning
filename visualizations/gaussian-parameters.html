<style>
  #gaussian-parameters {
    --axis-color: var(--muted-foreground, currentColor);
    --plot-height: 200px;
    max-width: 640px;
  }
  #gaussian-parameters .gaussian-axis-label { margin-bottom: .5em; }
  #gaussian-parameters .gaussian-chart {
    display: grid;
    grid-template-columns: 2.5em minmax(0, 1fr) 1.2em;
    row-gap: .35em;
    align-items: baseline;
  }
  #gaussian-parameters svg {
    display: block;
    width: 100%;
    height: var(--plot-height);
    border-inline-start: 1px solid var(--axis-color);
    border-block-end: 1px solid var(--axis-color);
    overflow: visible;
  }
  #gaussian-parameters svg path { vector-effect: non-scaling-stroke; stroke-width: 2.4; }
  #gaussian-parameters svg .gaussian-grid { stroke-width: 1; stroke: var(--axis-color); opacity: .25; }
  #gaussian-parameters .gaussian-y-ticks { position: relative; height: var(--plot-height); align-self: end; }
  #gaussian-parameters .gaussian-y-ticks span { position: absolute; right: .6em; transform: translateY(50%); }
  #gaussian-parameters .gaussian-x-ticks { grid-column: 2; position: relative; height: 1.25em; }
  #gaussian-parameters .gaussian-x-ticks span { position: absolute; transform: translateX(-50%); }
  #gaussian-parameters .gaussian-x-label { grid-column: 3; text-align: right; }
  #gaussian-parameters .gaussian-key { display: flex; flex-wrap: wrap; gap: .4em 1.1em; padding: 0; margin: .5em 0 0; list-style: none; }
  #gaussian-parameters .gaussian-key li { display: flex; gap: .4em; align-items: center; }
  #gaussian-parameters .gaussian-key span { display: block; width: 1.6em; height: 0; border-top: 2px solid var(--series-color); }
  #gaussian-parameters .reference { --series-color: var(--viz-series-1, var(--blue, currentColor)); stroke: var(--series-color); }
  #gaussian-parameters .shift { --series-color: var(--viz-series-2, var(--orange, currentColor)); stroke: var(--series-color); stroke-dasharray: 3 4; }
  #gaussian-parameters .spread { --series-color: var(--viz-series-3, var(--green, currentColor)); stroke: var(--series-color); stroke-dasharray: 10 5; }
  #gaussian-parameters .gaussian-key .shift { border-top-style: dotted; }
  #gaussian-parameters .gaussian-key .spread { border-top-style: dashed; }
</style>
